# ChemSource AI — запуск всей системы одной командой:
#   docker compose up --build
# Открыть в браузере: http://localhost (или публичный IP ВМ)

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chemsource}
      POSTGRES_USER: ${POSTGRES_USER:-chemsource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Двойной $ оставляет переменные для проверки внутри контейнера Postgres.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chemsource}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-chemsource}
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-secret-change-in-prod}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      # llama-server работает на хосте ВМ как отдельная systemd-служба.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen_Qwen3.5-27B-Q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed-for-local}
      LLM_AUTH_SCHEME: ${LLM_AUTH_SCHEME:-bearer}
      LLM_PROJECT_ID: ${LLM_PROJECT_ID:-}
      # Чем выключается режим рассуждения. Без выключателя модель тратит
      # весь лимит выхода на размышление и возвращает пустой ответ.
      LLM_THINKING_CONTROL: ${LLM_THINKING_CONTROL:-chat_template_kwargs}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-600}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-12288}
      # Должно совпадать с --parallel у llama-server. Воркеров больше, и
      # это верно для загрузки страниц, но у модели мест ровно столько:
      # третий одновременный вызов ждёт в очереди сервера, превышает
      # таймаут и возвращается как «модель недоступна».
      LLM_PARALLEL_SLOTS: ${LLM_PARALLEL_SLOTS:-2}
      # Источник поисковой выдачи и бюджеты этапа. Без явной передачи сюда
      # настройки из .env до контейнера не доходят и молча берутся из кода.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-duckduckgo_html}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_REGION: ${SERPER_REGION:-cn}
      SERPER_LANGUAGE: ${SERPER_LANGUAGE:-en}
      SEARCH_MAX_QUERIES: ${SEARCH_MAX_QUERIES:-12}
      SEARCH_MAX_PAGE_FETCHES: ${SEARCH_MAX_PAGE_FETCHES:-30}
      SEARCH_MAX_LLM_CALLS: ${SEARCH_MAX_LLM_CALLS:-40}
      SEARCH_MAX_RUNTIME_S: ${SEARCH_MAX_RUNTIME_S:-2700}
      SEARCH_LEASE_TTL_S: ${SEARCH_LEASE_TTL_S:-120}
      SEARCH_LEASE_HEARTBEAT_S: ${SEARCH_LEASE_HEARTBEAT_S:-30}
      ATTACHMENT_STORAGE_DIR: ${ATTACHMENT_STORAGE_DIR:-/app/data/attachments}
      ATTACHMENT_MAX_SIZE_MB: ${ATTACHMENT_MAX_SIZE_MB:-25}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-rus+eng}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-5}
      # Email по умолчанию работает в demo и не выполняет внешнюю отправку.
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-demo}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ChemSource AI}
      EMAIL_TIMEOUT_S: ${EMAIL_TIMEOUT_S:-30}
      AUTO_FOLLOWUP_MODE: ${AUTO_FOLLOWUP_MODE:-draft}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-true}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      WHATSAPP_TOKEN: ${WHATSAPP_TOKEN:-}
      WHATSAPP_PHONE_ID: ${WHATSAPP_PHONE_ID:-}
      WHATSAPP_API_BASE_URL: ${WHATSAPP_API_BASE_URL:-https://graph.facebook.com}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
      WHATSAPP_TIMEOUT_S: ${WHATSAPP_TIMEOUT_S:-30}
    volumes:
      - ./data/attachments:/app/data/attachments
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # urllib входит в Python-образ, поэтому для healthcheck не нужен curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  search-worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.search_worker"]
    # Воркеров больше, чем слотов у модели: значительную часть поиска занимает
    # загрузка страниц, и всё это время GPU простаивает. Замер на стенде при
    # двух слотах: параллельность 4 дала 377 запросов в час против 237 при
    # двух. Несколько процессов безопасны благодаря аренде задач — claim идёт
    # под FOR UPDATE SKIP LOCKED, а запись результата защищена fencing-токеном.
    deploy:
      replicas: 4
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chemsource}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-chemsource}
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-secret-change-in-prod}
      INTEGRATION_ENCRYPTION_KEY: ${INTEGRATION_ENCRYPTION_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen_Qwen3.5-27B-Q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed-for-local}
      LLM_AUTH_SCHEME: ${LLM_AUTH_SCHEME:-bearer}
      LLM_PROJECT_ID: ${LLM_PROJECT_ID:-}
      # Чем выключается режим рассуждения. Без выключателя модель тратит
      # весь лимит выхода на размышление и возвращает пустой ответ.
      LLM_THINKING_CONTROL: ${LLM_THINKING_CONTROL:-chat_template_kwargs}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-600}
      LLM_CONTEXT_TOKENS: ${LLM_CONTEXT_TOKENS:-12288}
      # Должно совпадать с --parallel у llama-server. Воркеров больше, и
      # это верно для загрузки страниц, но у модели мест ровно столько:
      # третий одновременный вызов ждёт в очереди сервера, превышает
      # таймаут и возвращается как «модель недоступна».
      LLM_PARALLEL_SLOTS: ${LLM_PARALLEL_SLOTS:-2}
      # Источник поисковой выдачи и бюджеты этапа. Без явной передачи сюда
      # настройки из .env до контейнера не доходят и молча берутся из кода.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-duckduckgo_html}
      SERPER_API_KEY: ${SERPER_API_KEY:-}
      SERPER_REGION: ${SERPER_REGION:-cn}
      SERPER_LANGUAGE: ${SERPER_LANGUAGE:-en}
      SEARCH_MAX_QUERIES: ${SEARCH_MAX_QUERIES:-12}
      SEARCH_MAX_PAGE_FETCHES: ${SEARCH_MAX_PAGE_FETCHES:-30}
      SEARCH_MAX_LLM_CALLS: ${SEARCH_MAX_LLM_CALLS:-40}
      SEARCH_MAX_RUNTIME_S: ${SEARCH_MAX_RUNTIME_S:-2700}
      SEARCH_LEASE_TTL_S: ${SEARCH_LEASE_TTL_S:-120}
      SEARCH_LEASE_HEARTBEAT_S: ${SEARCH_LEASE_HEARTBEAT_S:-30}
      ATTACHMENT_STORAGE_DIR: ${ATTACHMENT_STORAGE_DIR:-/app/data/attachments}
      ATTACHMENT_MAX_SIZE_MB: ${ATTACHMENT_MAX_SIZE_MB:-25}
      OCR_ENABLED: ${OCR_ENABLED:-true}
      OCR_LANGUAGES: ${OCR_LANGUAGES:-rus+eng}
      OCR_MAX_PAGES: ${OCR_MAX_PAGES:-5}
    volumes:
      - ./data/attachments:/app/data/attachments
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # The host timer uses this access log to measure real site inactivity.
      - ./data/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
