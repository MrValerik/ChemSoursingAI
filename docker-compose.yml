# ChemSource AI — запуск всей системы одной командой:
#   docker compose up --build
# Открыть в браузере: http://localhost (или публичный IP ВМ)

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-chemsource}
      POSTGRES_USER: ${POSTGRES_USER:-chemsource}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # Двойной $ оставляет переменные для проверки внутри контейнера Postgres.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-chemsource}:${POSTGRES_PASSWORD:-change_me}@db:5432/${POSTGRES_DB:-chemsource}
      REDIS_URL: redis://redis:6379/0
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:-dev-secret-change-in-prod}
      # llama-server работает на хосте ВМ как отдельная systemd-служба.
      LLM_BASE_URL: ${LLM_BASE_URL:-http://host.docker.internal:8000/v1}
      LLM_MODEL: ${LLM_MODEL:-Qwen_Qwen3.5-27B-Q4_K_M}
      LLM_API_KEY: ${LLM_API_KEY:-not-needed-for-local}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-300}
      # Email по умолчанию работает в demo и не выполняет внешнюю отправку.
      EMAIL_DELIVERY_MODE: ${EMAIL_DELIVERY_MODE:-demo}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_FROM_NAME: ${EMAIL_FROM_NAME:-ChemSource AI}
      EMAIL_TIMEOUT_S: ${EMAIL_TIMEOUT_S:-30}
      AUTO_FOLLOWUP_MODE: ${AUTO_FOLLOWUP_MODE:-draft}
      IMAP_HOST: ${IMAP_HOST:-}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASSWORD: ${IMAP_PASSWORD:-}
      IMAP_USE_SSL: ${IMAP_USE_SSL:-true}
      IMAP_FOLDER: ${IMAP_FOLDER:-INBOX}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-true}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      # urllib входит в Python-образ, поэтому для healthcheck не нужен curl.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      # The host timer uses this access log to measure real site inactivity.
      - ./data/nginx:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
