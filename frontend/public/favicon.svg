<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Знак для вкладки браузера. Рисуется в 16-20 px, поэтому внутреннее кольцо
    из полноразмерного логотипа опущено: на такой сетке оно превращается в шум.

    Цвет контура следует за оформлением браузера, а не за темой приложения:
    prefers-color-scheme здесь — это тема системы, и именно она задаёт цвет
    полосы вкладок. Акцентный узел одинаково читается на обоих фонах.
  -->
  <style>
    .ink { stroke: #1c1c1e; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #f2f2f3; }
    }
  </style>
  <path
    class="ink"
    d="M32 9 L51.9 20.5 L51.9 43.5 L32 55 L12.1 43.5 L12.1 20.5 Z"
    fill="none"
    stroke-width="6"
    stroke-linejoin="round"
  />
  <circle cx="32" cy="9" r="8.5" fill="#c15f3c" />
</svg>
