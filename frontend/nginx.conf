server {
  listen 80;

  # Keep a host-mounted activity log for the VM idle-shutdown timer.
  # Docker stdout remains enabled so `docker compose logs frontend` still works.
  access_log /dev/stdout combined;
  access_log /var/log/nginx/chemsource_access.log combined;
  error_log /dev/stderr warn;

  # Lightweight endpoint used by the browser to report real user interaction.
  # It does not wake Qwen or touch the database.
  location = /activity {
    add_header Cache-Control "no-store";
    return 204;
  }

  # API: /api/* -> backend:8000/* (префикс /api срезается слэшем в proxy_pass)
  #
  # Адрес backend подставляется через переменную намеренно. С обычным
  # `proxy_pass http://backend:8000/` nginx резолвит имя один раз, при
  # старте, и держит адрес до перезапуска. Пересборка backend даёт
  # контейнеру новый IP, nginx продолжает стучаться на старый, и весь
  # /api/* отвечает 502 — сайт выглядит недоступным, хотя backend здоров.
  # 8 августа 2026 так дважды ложился стенд, причём во второй раз при
  # полном `up -d --build`: фронтенд не пересобирался, а значит и не
  # перезапускался.
  #
  # Переменная заставляет nginx резолвить имя на каждый запрос через
  # встроенный DNS докера (127.0.0.11), поэтому новый адрес подхватывается
  # сам. Обратная сторона — путь надо дописывать вручную: при proxy_pass с
  # переменной nginx не срезает префикс location.
  location ~ ^/api/(?<backend_path>.*)$ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $chemsource_backend "backend:8000";
    proxy_pass http://$chemsource_backend/$backend_path$is_args$args;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Qwen 27B can take several minutes to finish a non-streaming response.
    # Keep nginx alive slightly longer than the backend's 300-second LLM timeout.
    proxy_connect_timeout 10s;
    proxy_send_timeout 360s;
    proxy_read_timeout 360s;
  }

  # SPA: всё остальное отдаём из статики, неизвестные пути -> index.html
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
