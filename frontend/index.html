<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Знак во вкладке. Отдельным файлом, а не data-URI: внутри есть
         медиазапрос, который в адресе пришлось бы экранировать до
         нечитаемости. Контур подстраивается под оформление браузера. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>ChemSource AI</title>
    <!-- Тема ставится до первой отрисовки: иначе при тёмной теме успевает
         мигнуть светлый фон. Основная тема — светлая; тёмная включается только
         явным выбором и запоминается. -->
    <script>
      (function () {
        var theme = "light";
        try {
          var saved = localStorage.getItem("chemsource-theme");
          if (saved === "light" || saved === "dark") theme = saved;
        } catch (e) {
          /* приватный режим — остаёмся на светлой */
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
